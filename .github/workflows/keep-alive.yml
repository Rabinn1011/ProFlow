name: Keep-alive

on:
  schedule:
    # Every 10 minutes. Render's free tier sleeps after ~15 minutes idle.
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    name: Ping /health
    runs-on: ubuntu-latest
    steps:
      - name: GET deployed /health
        # Replace YOUR_RENDER_URL_HERE with your Render hostname only,
        # e.g. proflow-api.onrender.com — no https://, no trailing slash.
        run: curl -f --max-time 90 "https://proflow-g3vx.onrender.com/health"
