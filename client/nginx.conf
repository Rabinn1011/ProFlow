server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # React Router owns the URL space: any unknown path must still return index.html,
  # otherwise a refresh on /app/workspaces/123 is a 404 from nginx.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed asset filenames are safe to cache hard; index.html must never be.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
