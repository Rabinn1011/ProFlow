# Included from every location block in nginx.conf. nginx drops server-level add_header
# directives in any location that declares its own, so these cannot live at server level.
#
# CSP: scripts only from this origin, so an injected <script> or inline handler will not
# run even if some future bug lets HTML through. connect-src lists where the app may send
# requests: the API and its websocket. Tighten https:/wss: to your exact API host once
# it is fixed.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' http://localhost:5000 ws://localhost:5000 https: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
